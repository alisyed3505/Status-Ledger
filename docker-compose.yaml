# WHY: docker-compose lets us define how our container should behave, what ports to open, and how it syncs with our local files.
services:
  web:
    image: node:20
    # IMPACT: every time the container boots, it ensures dependencies are installed in its isolated volume before starting Next.js
    # command: sh -c "npm install && npm run dev"

    # Second time running the container don't reinstall the dependencies
    command: npm run dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      # IMPACT: This syncs your code edits in real-time. If you change a React component, the container updates instantly without restarting.
      - ./:/app
      # IMPACT: We tell Docker NOT to sync the node_modules folder from your host (since you don't have one). It will use the one inside the container.
      - /app/node_modules